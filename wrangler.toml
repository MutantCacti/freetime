name = "freetime"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  # A zone route, not a custom domain: the accounts Worker (wrangler.accounts.toml)
  # takes its own paths on the same host, and more specific routes win.
  { pattern = "freetime.mutantcacti.com/*", zone_name = "mutantcacti.com" }
]

# The Worker runs first for every request, so security headers and the
# GET/HEAD-only rule also cover static files.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[rules]]
type = "Text"
globs = ["**/*.ics"]
fallthrough = true

# `npm run dev`: same app, fed from test/fixtures/dev.ics. No secret needed.
[env.dev]
main = "src/dev.ts"
workers_dev = true
routes = []

[env.dev.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
